# LiteLLM proxy config. Docs: https://docs.litellm.ai/docs/
# DeepSeek V3 configured as Claude Code backend.
# Set DEEPSEEK_API_KEY in .env.

model_list:
  - model_name: deepseek-chat
    litellm_params:
      model: openai/deepseek-chat
      api_key: ${DEEPSEEK_API_KEY}
      api_base: https://api.deepseek.com/v1

  # Moonshot AI (Kimi) — OpenAI-compatible.
  # Models: moonshot-v1-8k, moonshot-v1-32k, moonshot-v1-128k, kimi-k2.6
  # Set MOONSHOT_API_KEY in .env.
  - model_name: moonshot-chat
    litellm_params:
      model: openai/moonshot-v1-128k
      api_key: ${MOONSHOT_API_KEY}
      api_base: https://api.moonshot.cn/v1
