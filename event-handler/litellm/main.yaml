# LiteLLM proxy config. Docs: https://docs.litellm.ai/docs/
# DeepSeek V3 configured as Claude Code backend.
# Set DEEPSEEK_API_KEY in .env.
# AIHubMix — OpenAI-compatible proxy for free tier models.
# Set AIHUBMIX_API_KEY in .env.

model_list:
  - model_name: deepseek-chat
    litellm_params:
      model: openai/deepseek-chat
      api_key: ${DEEPSEEK_API_KEY}
      api_base: https://api.deepseek.com/v1

  # ── AIHubMix free-tier models ──────────────────────────────────────────
  # Base URL: https://aihubmix.com/v1
  # Use any of these as llm_model in triggers or chat overrides.

  - model_name: aihubmix-glm-5.2
    litellm_params:
      model: openai/coding-glm-5.2-free
      api_key: ${AIHUBMIX_API_KEY}
      api_base: https://aihubmix.com/v1

  - model_name: aihubmix-kimi-k3
    litellm_params:
      model: openai/coding-kimi-k3-free
      api_key: ${AIHUBMIX_API_KEY}
      api_base: https://aihubmix.com/v1

  - model_name: aihubmix-gpt-5.5
    litellm_params:
      model: openai/gpt-5.5-free
      api_key: ${AIHUBMIX_API_KEY}
      api_base: https://aihubmix.com/v1

  - model_name: aihubmix-gpt-image-2
    litellm_params:
      model: openai/gpt-image-2-free
      api_key: ${AIHUBMIX_API_KEY}
      api_base: https://aihubmix.com/v1

  - model_name: aihubmix-mimo-v2.5
    litellm_params:
      model: openai/xiaomi-mimo-v2.5-pro-free
      api_key: ${AIHUBMIX_API_KEY}
      api_base: https://aihubmix.com/v1

  - model_name: aihubmix-minimax-m3
    litellm_params:
      model: openai/coding-minimax-m3-free
      api_key: ${AIHUBMIX_API_KEY}
      api_base: https://aihubmix.com/v1

  - model_name: aihubmix-gemma-2-9b
    litellm_params:
      model: openai/google/gemma-2-9b-it:free
      api_key: ${AIHUBMIX_API_KEY}
      api_base: https://aihubmix.com/v1
