server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 256;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # The atlas is a single self-contained file. SPA-style fallback just in case.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(png|jpg|jpeg|gif|svg|ico|webp|css|js|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
