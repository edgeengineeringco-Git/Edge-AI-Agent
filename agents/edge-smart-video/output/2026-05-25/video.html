<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDGE | Real-time soil specification via portable XRF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #f0f4f0;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

.player {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    box-shadow:
        0 0 0 1px rgba(26, 122, 58, 0.1),
        0 30px 80px rgba(0, 0, 0, 0.6);
    z-index: 1;
}

/* Progress bar */
.progress-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(0,0,0,0.04);
    z-index: 100;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1a7a3a, #145c2d);
    transition: width 0.1s linear;
    width: 0%;
}

/* Slides */
.slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform: scale(0.97);
    padding: 60px 80px;
}
.slide.active {
    opacity: 1;
    transform: scale(1);
}

/* Brand watermark */
.brand-watermark {
    position: absolute;
    top: 24px;
    left: 32px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
}
.brand-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #1a7a3a;
}
.brand-name {
    color: #1a7a3a;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
}

/* Title slide */
.slide-title {
    justify-content: center;
    align-items: center;
    text-align: center;
}
.slide-title .sector-tag {
    color: #1a7a3a;
    font-size: clamp(12px, 1.4vw, 18px);
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
}
.slide-title h1 {
    color: #1e293b;
    font-size: clamp(28px, 4vw, 56px);
    font-weight: 800;
    line-height: 1.15;
    max-width: 800px;
    margin: 0 auto 20px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s forwards;
}
.slide-title .subtitle {
    color: #64748b;
    font-size: clamp(14px, 1.5vw, 22px);
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 0.6s 0.6s forwards;
}
.slide-title .tagline-bar {
    margin-top: 32px;
    width: 60px;
    height: 2px;
    background: #1a7a3a;
    margin-left: auto;
    margin-right: auto;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
}

/* Content slide */
.slide-content {
    justify-content: center;
}
.slide-content .slide-header {
    margin-bottom: 32px;
}
.slide-content .slide-number {
    color: #1a7a3a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 6px;
}
.slide-content h2 {
    color: #1e293b;
    font-size: clamp(22px, 2.8vw, 40px);
    font-weight: 700;
    line-height: 1.2;
    position: relative;
    padding-bottom: 16px;
}
.slide-content h2::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 50px;
    height: 3px;
    background: #1a7a3a;
    border-radius: 2px;
}
.slide-content .bullets {
    margin-top: 28px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.slide-content .bullets li {
    color: #64748b;
    font-size: clamp(13px, 1.3vw, 20px);
    line-height: 1.5;
    padding-left: 28px;
    position: relative;
    opacity: 0;
    animation: fadeUp 0.4s forwards;
}
.slide-content .bullets li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    width: 10px;
    height: 10px;
    border: 2px solid #1a7a3a;
    border-radius: 50%;
    opacity: 0.6;
}
.slide-content .bullets li:nth-child(1) { animation-delay: 0.2s; }
.slide-content .bullets li:nth-child(2) { animation-delay: 0.35s; }
.slide-content .bullets li:nth-child(3) { animation-delay: 0.5s; }
.slide-content .bullets li:nth-child(4) { animation-delay: 0.65s; }

/* Content slide with SVG schematic */
.slide-content.has-svg {
    flex-direction: row;
    align-items: center;
    gap: 40px;
}
.slide-text {
    flex: 1;
    min-width: 0;
}
.slide-svg {
    flex: 0 0 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.6s 0.3s forwards;
}
.slide-svg svg {
    width: 100%;
    height: auto;
    max-height: 340px;
    border-radius: 8px;
}

/* Background SVG for title and CTA slides */
.slide-bg-svg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.06;
    z-index: -1;
    overflow: hidden;
}
.slide-bg-svg svg {
    width: 80%;
    height: 80%;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* CTA slide */
.slide-cta {
    justify-content: center;
    align-items: center;
    text-align: center;
}
.slide-cta h2 {
    color: #1e293b;
    font-size: clamp(24px, 3vw, 44px);
    font-weight: 800;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
}
.slide-cta .cta-url {
    color: #1a7a3a;
    font-size: clamp(18px, 2vw, 32px);
    font-weight: 700;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
}
.slide-cta .cta-sub {
    color: #64748b;
    font-size: clamp(11px, 1vw, 16px);
    margin-top: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
    opacity: 0.4;
}

/* Navigation */
.nav {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    gap: 8px;
    align-items: center;
}
.nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(0,0,0,0.1);
    cursor: pointer;
    transition: all 0.3s;
    border: none;
}
.nav-dot.active {
    background: #1a7a3a;
    box-shadow: 0 0 12px rgba(26, 122, 58, 0.4);
    width: 24px;
    border-radius: 4px;
}

/* Animations */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 640px) {
    .slide { padding: 32px 24px; }
}
</style>
</head>

<div class="player" id="player" tabindex="0">

    <div id="slidesContainer"></div>
    <div class="nav" id="nav"></div>
</div>

ght=\"700\" fill=\"#d97706\" text-anchor=\"middle\">3</text>\n  <text x=\"68\" y=\"208\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#1e293b\">Idle plant &amp; delays</text>\n\n  <!-- Downward Arrow -->\n  <line x1=\"47\" y1=\"220\" x2=\"47\" y2=\"234\" stroke=\"#d1e7d6\" stroke-width=\"2\" />\n  <polygon points=\"47,239 43,232 51,232\" fill=\"#d1e7d6\" />\n\n  <!-- Step 4: Design Rework -->\n  <circle cx=\"47\" cy=\"254\" r=\"14\" fill=\"#d97706\" opacity=\"0.12\" />\n  <text x=\"47\" y=\"258\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#d97706\" text-anchor=\"middle\">4</text>\n  <text x=\"68\" y=\"258\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#1e293b\">Design rework cycles</text>\n\n  <!-- Downward Arrow -->\n  <line x1=\"47\" y1=\"270\" x2=\"47\" y2=\"284\" stroke=\"#d1e7d6\" stroke-width=\"2\" />\n  <polygon points=\"47,289 43,282 51,282\" fill=\"#d1e7d6\" />\n\n  <!-- Step 5: Over Budget (Cost Impact) -->\n  <circle cx=\"47\" cy=\"304\" r=\"14\" fill=\"#d97706\" opacity=\"0.12\" />\n  <text x=\"47\" y=\"308\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#d97706\" text-anchor=\"middle\">5</text>\n  <text x=\"68\" y=\"308\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"11\" font-weight=\"600\" fill=\"#1e293b\">Budget overruns</text>\n\n  <!-- ========== THE \"COST\" WASTE OVERLAY (Connecting Problem to Money) ========== -->\n  <!-- This large box visually shows the entire central wait step creating cascading waste -->\n  <rect x=\"20\" y=\"118\" width=\"220\" height=\"200\" rx=\"6\" fill=\"url(#wasteHatch)\" opacity=\"0.6\" />\n  \n  <!-- Financial Icons in the waste zone -->\n  <!-- Dashed money line connecting waste to the final cost -->\n  <path d=\"M 130 140 L 130 280\" stroke=\"#d97706\" stroke-width=\"2\" stroke-dasharray=\"4 3\" opacity=\"0.5\" />\n  \n  <!-- Dollar signs dropping vertically through the waste area -->\n  <text x=\"130\" y=\"160\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#d97706\" text-anchor=\"middle\" opacity=\"0.8\">$</text>\n  <text x=\"130\" y=\"190\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#d97706\" text-anchor=\"middle\" opacity=\"0.6\">$</text>\n  <text x=\"130\" y=\"220\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#d97706\" text-anchor=\"middle\" opacity=\"0.4\">$</text>\n  <text x=\"130\" y=\"250\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#d97706\" text-anchor=\"middle\" opacity=\"0.3\">$</text>\n  <text x=\"130\" y=\"280\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#d97706\" text-anchor=\"middle\" opacity=\"0.2\">$</text>\n\n  <!-- Large \"WASTE\" stamp -->\n  <text x=\"188\" y=\"240\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"28\" font-weight=\"900\" fill=\"#d97706\" opacity=\"0.08\" text-anchor=\"end\" transform=\"rotate(-15 188 240)\">WASTE</text>\n\n\n  <!-- ==================== PORTABLE XRF SOLUTION (RIGHT SIDE) ==================== -->\n\n  <!-- Right Background Panel -->\n  <rect x=\"255\" y=\"20\" width=\"230\" height=\"300\" rx=\"8\" fill=\"#ffffff\" filter=\"url(#shadow)\" stroke=\"#e8f4ec\" stroke-width=\"1.5\" />\n\n  <!-- Section Header -->\n  <rect x=\"255\" y=\"20\" width=\"230\" height=\"38\" rx=\"8\" fill=\"#1a7a3a\" />\n  <rect x=\"255\" y=\"40\" width=\"230\" height=\"18\" fill=\"#1a7a3a\" />\n  <text x=\"269\" y=\"40\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#ffffff\" letter-spacing=\"0.5\">PORTABLE XRF</text>\n\n  <!-- XRF Device Graphic (Top Right) -->\n  <g transform=\"translate(350, 82)\">\n    <!-- Device Shadow -->\n    <rect x=\"8\" y=\"4\" width=\"56\" height=\"38\" rx=\"5\" fill=\"#000000\" opacity=\"0.08\" />\n    <!-- Device Body -->\n    <path d=\"M 10 0 L 50 0 C 55 0 60 5 60 10 L 60 30 C 60 35 55 38 50 38 L 10 38 C 5 38 0 35 0 30 L 0 10 C 0 5 5 0 10 0 Z\" fill=\"#d1e7d6\" stroke=\"#1a7a3a\" stroke-width=\"2\" />\n    <!-- Screen -->\n    <rect x=\"8\" y=\"6\" width=\"28\" height=\"20\" rx=\"3\" fill=\"#145c2d\" />\n    <!-- Scanning Beam Graphic on Screen -->\n    <path d=\"M 12 14 L 24 14 M 12 18 L 20 18\" stroke=\"#d1e7d6\" stroke-width=\"1.5\" stroke-linecap=\"round\" />\n    <!-- Trigger / Handle -->\n    <path d=\"M 44 20 L 54 20 L 54 32 L 44 32 Z\" fill=\"#145c2d\" />\n    <!-- Probe Head -->\n    <rect x=\"40\" y=\"30\" width=\"20\" height=\"4\" rx=\"1\" fill=\"#145c2d\" />\n    <!-- Signal lines -->\n    <path d=\"M 30 26 L 30 36\" stroke=\"#d97706\" stroke-width=\"2\" />\n    <circle cx=\"30\" cy=\"40\" r=\"3\" fill=\"#d97706\" />\n    <path d=\"M 30 43 L 30 48\" stroke=\"#d97706\" stroke-width=\"1.5\" stroke-dasharray=\"2 2\" />\n  </g>\n\n  <!-- \"1 Hour\" Time Indicator -->\n  <rect x=\"275\" y=\"125\" width=\"85\" height=\"24\" rx=\"12\" fill=\"#e8f4ec\" />\n  <circle cx=\"287\" cy=\"137\" r=\"7\" fill=\"#1a7a3a\" />\n  <path d=\"M 287 137 L 287 132\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-linecap=\"round\" />\n  <path d=\"M 287 137 L 291 137\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-linecap=\"round\" />\n  <text x=\"300\" y=\"141\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"10\" font-weight=\"700\" fill=\"#1a7a3a\">\u2264 1 HOUR</text>\n\n  <!-- Data Output Arrows -->\n  <path d=\"M 305 110 L 330 110\" stroke=\"#d1e7d6\" stroke-width=\"2\" />\n  <polygon points=\"332,110 325,106 325,114\" fill=\"#d1e7d6\" />\n  \n  <path d=\"M 305 140 L 330 140\" stroke=\"#d1e7d6\" stroke-width=\"2\" />\n  <polygon points=\"332,140 325,136 325,144\" fill=\"#d1e7d6\" />\n\n  <!-- Data Outcome List (Instant Decisions) -->\n  <rect x=\"335\" y=\"98\" width=\"140\" height=\"24\" rx=\"4\" fill=\"#e8f4ec\" />\n  <circle cx=\"345\" cy=\"110\" r=\"3\" fill=\"#1a7a3a\" />\n  <text x=\"354\" y=\"114\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"9\" font-weight=\"600\" fill=\"#1e293b\">Instant data</text>\n\n  <rect x=\"335\" y=\"128\" width=\"140\" height=\"24\" rx=\"4\" fill=\"#e8f4ec\" />\n  <circle cx=\"345\" cy=\"140\" r=\"3\" fill=\"#1a7a3a\" />\n  <text x=\"354\" y=\"144\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"9\" font-weight=\"600\" fill=\"#1e293b\">Same-day decisions</text>\n\n  <rect x=\"335\" y=\"158\" width=\"140\" height=\"24\" rx=\"4\" fill=\"#e8f4ec\" />\n  <circle cx=\"345\" cy=\"170\" r=\"3\" fill=\"#1a7a3a\" />\n  <text x=\"354\" y=\"174\" font-family=\"system-ui, -apple-system, sans-serif\" font-size=\"9\" font-weight=\"600\" fill=\"#1e293b\">Reduced redesign</text>\n\n  <rect x=\"335\" y=\"188\" width=\"140\" height=\"24\" rx=\"4\" fill=\"#e8f4ec\" />\n  <circle cx=\"345\" cy=\"200\" r=\"3\" fill=\"#1a7a3a\" />\n  <text x=\"354\" y=\"204"}, {"slide_index": 2, "slide_type": "content", "headline": "The EDGE Solution: Real-Time XRF", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 340\">\n  <defs>\n    <!-- Gradient Definitions for Depth -->\n    <linearGradient id=\"bgGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#f8fafc\"/>\n      <stop offset=\"100%\" stop-color=\"#e2e8f0\"/>\n    </linearGradient>\n    \n    <linearGradient id=\"scannerGrad\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#ffffff\"/>\n      <stop offset=\"100%\" stop-color=\"#f1f5f9\"/>\n    </linearGradient>\n    \n    <linearGradient id=\"screenGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#e2e8f0\"/>\n      <stop offset=\"100%\" stop-color=\"#cbd5e1\"/>\n    </linearGradient>\n\n    <linearGradient id=\"beamGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#d97706\" stop-opacity=\"0.9\"/>\n      <stop offset=\"100%\" stop-color=\"#d97706\" stop-opacity=\"0\"/>\n    </linearGradient>\n\n    <linearGradient id=\"glassGrad\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#ffffff\" stop-opacity=\"0.8\"/>\n      <stop offset=\"100%\" stop-color=\"#ffffff\" stop-opacity=\"0.1\"/>\n    </linearGradient>\n\n    <!-- Arrow Marker -->\n    <marker id=\"arrow\" markerWidth=\"6\" markerHeight=\"6\" refX=\"5\" refY=\"3\" orient=\"auto\" markerUnits=\"strokeWidth\">\n      <path d=\"M 0 0 L 6 3 L 0 6 L 1.5 3 Z\" fill=\"#d97706\"/>\n    </marker>\n\n    <!-- Drop Shadow Filter -->\n    <filter id=\"shadow\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">\n      <feDropShadow dx=\"0\" dy=\"4\" stdDeviation=\"4\" flood-color=\"#1e293b\" flood-opacity=\"0.15\"/>\n    </filter>\n    \n    <filter id=\"softGlow\" x=\"-30%\" y=\"-30%\" width=\"160%\" height=\"160%\">\n      <feGaussianBlur stdDeviation=\"3\" result=\"blur\" />\n      <feComposite in=\"SourceGraphic\" in2=\"blur\" operator=\"over\" />\n    </filter>\n\n    <clipPath id=\"screenClip\">\n      <rect x=\"126\" y=\"195\" width=\"52\" height=\"42\" rx=\"4\"/>\n    </clipPath>\n  </defs>\n\n  <!-- === BACKGROUND === -->\n  <rect width=\"500\" height=\"340\" fill=\"url(#bgGrad)\" rx=\"16\"/>\n  <!-- Subtle background grid -->\n  <pattern id=\"grid\" width=\"20\" height=\"20\" patternUnits=\"userSpaceOnUse\">\n    <path d=\"M 20 0 L 0 0 0 20\" fill=\"none\" stroke=\"#cbd5e1\" stroke-width=\"0.5\"/>\n  </pattern>\n  <rect width=\"500\" height=\"340\" fill=\"url(#grid)\" opacity=\"0.3\"/>\n\n  <!-- === HEADER === -->\n  <rect x=\"15\" y=\"15\" width=\"470\" height=\"50\" rx=\"10\" fill=\"#ffffff\" filter=\"url(#shadow)\"/>\n  <rect x=\"15\" y=\"15\" width=\"4\" height=\"50\" rx=\"2\" fill=\"#1a7a3a\"/>\n  <text x=\"35\" y=\"32\" font-family=\"Arial, sans-serif\" font-weight=\"800\" font-size=\"14\" fill=\"#1a7a3a\">THE EDGE SOLUTION</text>\n  <text x=\"35\" y=\"50\" font-family=\"Arial, sans-serif\" font-weight=\"400\" font-size=\"11\" fill=\"#64748b\">Real-Time XRF Soil Specification</text>\n  \n  <!-- Rig Status Indicator -->\n  <g transform=\"translate(425, 24)\">\n    <circle cx=\"0\" cy=\"5\" r=\"4\" fill=\"#d97706\">\n      <animate attributeName=\"opacity\" values=\"1;0.3;1\" dur=\"1.5s\" repeatCount=\"indefinite\"/>\n    </circle>\n    <text x=\"12\" y=\"9\" font-family=\"Arial, sans-serif\" font-weight=\"600\" font-size=\"10\" fill=\"#1a7a3a\">RIG LIVE</text>\n  </g>\n\n  <!-- === PHASE 1: RIG & SAMPLING (LEFT) === -->\n  <text x=\"60\" y=\"96\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#145c2d\">1. DRILLING & SAMPLING</text>\n  \n  <!-- Shadowed Card -->\n  <rect x=\"25\" y=\"105\" width=\"140\" height=\"120\" rx=\"12\" fill=\"#ffffff\" filter=\"url(#shadow)\"/>\n  \n  <!-- Geology Profile -->\n  <path d=\"M 35 225 L 55 200 L 75 180 L 95 190 L 115 170 L 135 195 L 155 205\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"2\" stroke-linecap=\"round\"/>\n  <circle cx=\"75\" cy=\"180\" r=\"3\" fill=\"#d97706\"/>\n  <circle cx=\"115\" cy=\"170\" r=\"3\" fill=\"#d97706\"/>\n  \n  <!-- Soil Strata -->\n  <path d=\"M 35 215 Q 65 200 95 210 T 155 195\" fill=\"none\" stroke=\"#d1e7d6\" stroke-width=\"12\" stroke-linecap=\"round\"/>\n  <path d=\"M 35 225 Q 65 210 95 220 T 155 205\" fill=\"none\" stroke=\"#e8f4ec\" stroke-width=\"6\" stroke-linecap=\"round\"/>\n  \n  <!-- Soil Samples (Bags/Tubes) -->\n  <g transform=\"translate(145, 105)\">\n    <rect x=\"0\" y=\"15\" width=\"10\" height=\"25\" rx=\"2\" fill=\"#d1e7d6\"/>\n    <rect x=\"15\" y=\"5\" width=\"10\" height=\"35\" rx=\"2\" fill=\"#e8f4ec\" stroke=\"#1a7a3a\" stroke-width=\"1.5\"/>\n  </g>\n  \n  <!-- Drill Rig Silhouette -->\n  <path d=\"M 25 225 L 25 130 L 55 130 L 55 105 L 65 105 L 65 130 L 95 130 L 95 225\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  <path d=\"M 25 225 L 155 225\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  <!-- Drill tower structure -->\n  <line x1=\"25\" y1=\"130\" x2=\"95\" y2=\"105\" stroke=\"#1e293b\" stroke-width=\"1.5\"/>\n  <line x1=\"95\" y1=\"130\" x2=\"25\" y2=\"105\" stroke=\"#1e293b\" stroke-width=\"1.5\"/>\n  <line x1=\"60\" y1=\"105\" x2=\"60\" y2=\"225\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  \n  <!-- Live Pulse -->\n  <circle cx=\"60\" cy=\"145\" r=\"4\" fill=\"#d97706\" opacity=\"0.8\">\n    <animate attributeName=\"r\" values=\"4;8;4\" dur=\"2s\" repeatCount=\"indefinite\"/>\n    <animate attributeName=\"opacity\" values=\"0.8;0;0.8\" dur=\"2s\" repeatCount=\"indefinite\"/>\n  </circle>\n\n  <!-- === FLOW ARROW 1: RIG TO XRF === -->\n  <path d=\"M 175 165 L 195 165\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"2\" stroke-dasharray=\"4 2\" marker-end=\"url(#arrow)\"/>\n  \n  <!-- === PHASE 2: PORTABLE XRF SCANNER (CENTER) === -->\n  <text x=\"250\" y=\"96\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-weight=\"800\" font-size=\"13\" fill=\"#145c2d\">2. PORTABLE XRF SCAN</text>\n  \n  <!-- Shadowed Card -->\n  <rect x=\"210\" y=\"105\" width=\"80\" height=\"120\" rx=\"12\" fill=\"url(#scannerGrad)\" filter=\"url(#shadow)\"/>\n  \n  <!-- XRF Scanner Body -->\n  <rect x=\"220\" y=\"120\" width=\"60\" height=\"75\" rx=\"8\" fill=\"#ffffff\" stroke=\"#1e293b\" stroke-width=\"2\"/>\n  \n  <!-- XRF Screen / Glass -->\n  <rect x=\"225\" y=\"130\" width=\"50\" height=\"40\" rx=\"4\" fill=\"url(#screenGrad)\"/>\n  \n  <!-- Screen Scanlines & Element Readouts -->\n  <clipPath id=\"screen-clip\">\n    <rect x=\"225\" y=\"130\" width=\"50\" height=\"40\" rx=\"4\"/>\n  </clipPath>\n  <g clip-path=\"url(#screen-clip)\">\n    <path d=\"M 225 135 L 275 135\" stroke=\"#d1e7d6\" stroke-width=\"1\"/>\n    <path d=\"M 225 140 L 275 140\" stroke=\"#d1e7d6\" stroke-width=\"1\"/>\n    <path d=\"M 225 145 L 275 145\" stroke=\"#d1e7d6\" stroke-width=\"1\"/>\n    <path d=\"M 225 150 L 275 150\" stroke=\"#d1e7d6\" stroke-width=\"1\"/>\n    <path d=\"M 225 155 L 275 155\" stroke=\"#d1e7d6\" stroke-width=\"1\"/>\n    \n    <!-- Active Scanned Elements (Green & Amber) -->\n    <rect x=\"228\" y=\"133\" width=\"8\" height=\"3\" fill=\"#1a7a3a\"/>\n    <rect x=\"240\" y=\"143\" width=\"6\" height=\"3\" fill=\"#d97706\"/>\n    <rect x=\"235\" y=\"153\" width=\"10\" height=\"3\" fill=\"#1a7a3a\"/>\n  </g>\n  \n  <!-- XRF Trigger/Handle -->\n  <path d=\"M 225 195 L 225 175 L 275 175 L 275 185\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"2\" stroke-linejoin=\"round\"/>\n  \n  <!-- Amber Light Beacon -->\n  <path d=\"M 250 120 L 250 115\" stroke=\"#d97706\" stroke-width=\"2\"/>\n  <circle cx=\"250\" cy=\"112\" r=\"3\" fill=\"#d97706\">\n    <animate attributeName=\"opacity\" values=\"1;0.3;1\" dur=\"1s\" repeatCount=\"indefinite\"/>\n  </circle>\n\n  <!-- === XRF BEAM & SOIL SAMPLE INTERACTION === -->\n  <!-- Sample Tray Base -->\n  <rect x=\"235\" y=\"210\" width=\"30\" height=\"8\" rx=\"2\" fill=\"#1e293b\"/>\n  <!-- Piled Soil -->\n  <path d=\"M 240 210 Q 250 195 260 210\" fill=\"#e8f4ec\" stroke=\"#1a7a3a\" stroke-width=\"1.5\"/>\n  \n  <!-- Downward XRF Beam -->\n  <polygon points=\"245,175 255,175 252,210 248,210\" fill=\"url(#beamGrad)\"/>\n  <!-- Beam particles -->\n  <circle cx=\"250\" cy=\"185\" r=\"1.5\" fill=\"#d97706\"/>\n  <circle cx=\"250\" cy=\"198\" r=\"1.5\" fill=\"#d97706\"/>\n  <circle cx=\"248\" cy=\"192\" r=\"1.5\" fill=\"#d97706\"/>\n  <circle cx=\"252\" cy=\"195\" r=\"1.5\" fill=\"#d97706\"/>\n\n  <!-- === FLOW ARROW 2: XRF TO DATA FEED === -->\n  <path d=\"M 290 165 L 310 165\" fill=\"none\" stroke=\"#64748b\" stroke-width=\"2\" stroke-dasharray=\"4 2\" marker-end=\"url(#arrow)\"/>\n\n  <!-- === PHASE 3: REAL-TIME DATA FEED (CENTER-RIGHT) === -->\n  <text x=\"360\" y=\"96\" text-anchor=\"middle\" font-family=\"Arial, sans-serif\" font-weight=\"800\" font-size=\"13\" fil nejoin=\"round\" marker-end=\"url(#arrowHeadLight)\"/>\n\n  <!-- XRF analysis dynamic radial lines -->\n  <line x1=\"100\" y1=\"150\" x2=\"130\" y2=\"120\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n  <line x1=\"100\" y1=\"150\" x2=\"75\" y2=\"115\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n  <line x1=\"100\" y1=\"150\" x2=\"135\" y2=\"155\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n  <line x1=\"100\" y1=\"150\" x2=\"100\" y2=\"190\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n  <line x1=\"100\" y1=\"150\" x2=\"65\" y2=\"170\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\" opacity=\"0.6\"/>\n  <!-- XRF core dot -->\n  <circle cx=\"100\" cy=\"150\" r=\"4\" fill=\"#1a7a3a\"/>\n\n  <!-- Scan concentric rings -->\n  <circle cx=\"100\" cy=\"150\" r=\"12\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" opacity=\"0.5\"/>\n  <circle cx=\"100\" cy=\"150\" r=\"22\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"1\" opacity=\"0.35\"/>\n  <circle cx=\"100\" cy=\"150\" r=\"34\" fill=\"none\" stroke=\"#d1e7d6\" stroke-width=\"1\" opacity=\"0.8\"/>\n\n  <!-- Scatter data/seed dots (Growth motif) -->\n  <!-- Cluster 1 -->\n  <circle cx=\"220\" cy=\"180\" r=\"3\" fill=\"#1a7a3a\" opacity=\"0.8\"/>\n  <circle cx=\"235\" cy=\"160\" r=\"2\" fill=\"#1a7a3a\" opacity=\"0.6\"/>\n  <circle cx=\"205\" cy=\"165\" r=\"2.5\" fill=\"#d1e7d6\" opacity=\"0.9\"/>\n  \n  <!-- Cluster 2 -->\n  <circle cx=\"450\" cy=\"120\" r=\"3\" fill=\"#1a7a3a\" opacity=\"0.8\"/>\n  <circle cx=\"465\" cy=\"110\" r=\"2\" fill=\"#d1e7d6\" opacity=\"0.9\"/>\n  <circle cx=\"440\" cy=\"95\" r=\"2.5\" fill=\"#1a7a3a\" opacity=\"0.6\"/>\n\n  <!-- Scattered subtle nodes across the composition -->\n  <circle cx=\"50\" cy=\"100\" r=\"2\" fill=\"#d1e7d6\"/>\n  <circle cx=\"250\" cy=\"70\" r=\"3\" fill=\"#d1e7d6\" opacity=\"0.7\"/>\n  <circle cx=\"350\" cy=\"40\" r=\"2\" fill=\"#1a7a3a\" opacity=\"0.5\"/>\n  <circle cx=\"530\" cy=\"230\" r=\"3\" fill=\"#1a7a3a\" opacity=\"0.6\"/>\n  <circle cx=\"480\" cy=\"290\" r=\"2.5\" fill=\"#d1e7d6\"/>\n  <circle cx=\"260\" cy=\"280\" r=\"2\" fill=\"#1a7a3a\" opacity=\"0.4\"/>\n\n  <!-- Fine detail vectors / data-scatter ascending -->\n  <polyline points=\"300,280 310,250 300,220 315,190\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" opacity=\"0.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n  <polyline points=\"520,340 530,310 515,280 525,250\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" opacity=\"0.4\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/>\n\n  <!-- Subtle 3D/Blueprint diagonal guide lines (Depth & Engineering context) -->\n  <line x1=\"0\" y1=\"120\" x2=\"120\" y2=\"0\" stroke=\"#1a7a3a\" stroke-width=\"0.5\" opacity=\"0.15\"/>\n  <line x1=\"0\" y1=\"240\" x2=\"240\" y2=\"0\" stroke=\"#1a7a3a\" stroke-width=\"0.5\" opacity=\"0.15\"/>\n  <line x1=\"0\" y1=\"360\" x2=\"360\" y2=\"0\" stroke=\"#1a7a3a\" stroke-width=\"0.5\" opacity=\"0.15\"/>\n  <line x1=\"120\" y1=\"400\" x2=\"600\" y2=\"-80\" stroke=\"#1a7a3a\" stroke-width=\"0.5\" opacity=\"0.15\" style=\"display:none\"/> <!-- clamped out of bounds, ignore -->\n  <line x1=\"240\" y1=\"400\" x2=\"600\" y2=\"40\" stroke=\"#1a7a3a\" stroke-width=\"0.5\" opacity=\"0.15\"/>\n  <line x1=\"360\" y1=\"400\" x2=\"600\" y2=\"160\" stroke=\"#1a7a3a\" stroke-width=\"0.5\" opacity=\"0.15\"/>\n  \n  <!-- Structural vertical anchor -->\n  <line x1=\"0\" y1=\"200\" x2=\"600\" y2=\"200\" stroke=\"#1a7a3a\" stroke-width=\"0.5\" opacity=\"0.1\"/>\n  <line x1=\"0\" y1=\"100\" x2=\"600\" y2=\"100\" stroke=\"#1a7a3a\" stroke-width=\"0.5\" opacity=\"0.1\"/>\n\n</svg>"}];
const SLIDE_DURATION = 5000;
let current = 0;
let timer = null;
let progressInterval = null;

function render() {
    const container = document.getElementById('slidesContainer');
    const nav = document.getElementById('nav');
    container.innerHTML = '';
    nav.innerHTML = '';

    slides.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = 'slide' + (i === current ? ' active' : '');

        const svgData = schematics && schematics[i] && schematics[i].svg;

        if (slide.type === 'title') {
            div.className += ' slide-title' + (svgData ? ' has-bg-svg' : '');
            div.innerHTML = `
                ${svgData ? `<div class="slide-bg-svg">${svgData}</div>` : ''}
                <div class="sector-tag">${slide.sector || 'Geotechnical Engineering'}</div>
                <h1>${slide.headline}</h1>
                ${slide.subtitle ? `<div class="subtitle">${slide.subtitle}</div>` : ''}
                <div class="tagline-bar"></div>
            `;
        } else if (slide.type === 'cta') {
            div.className += ' slide-cta' + (svgData ? ' has-bg-svg' : '');
            div.innerHTML = `
                ${svgData ? `<div class="slide-bg-svg">${svgData}</div>` : ''}
                <h2>${slide.headline}</h2>
                <div class="cta-url">${slide.url || 'www.edgeengineers.net'}</div>
                ${slide.subtitle ? `<div class="cta-sub">${slide.subtitle}</div>` : ''}
            `;
        } else {
            div.className += ' slide-content' + (svgData ? ' has-svg' : '');
            const bullets = (slide.bullets || []).map(b => `<li>${b}</li>`).join('');
            div.innerHTML = `
                <div class="slide-text">
                    <div class="slide-header">
                        <div class="slide-number">${slide.number || (i + 1)} / ${slides.length}</div>
                        <h2>${slide.headline}</h2>
                    </div>
                    ${bullets ? `<ul class="bullets">${bullets}</ul>` : ''}
                </div>
                ${svgData ? `<div class="slide-svg">${svgData}</div>` : ''}
            `;
        }

        container.appendChild(div);

        const dot = document.createElement('button');
        dot.className = 'nav-dot' + (i === current ? ' active' : '');
        dot.onclick = () => goTo(i);
        nav.appendChild(dot);
    });
}

function goTo(i) {
    current = i;
    render();
    resetTimer();
}

function next() {
    current = (current + 1) % slides.length;
    render();
    resetTimer();
}

function resetTimer() {
    if (timer) clearInterval(timer);
    if (progressInterval) clearInterval(progressInterval);
    timer = setInterval(next, SLIDE_DURATION);
    updateProgress();
}

function updateProgress() {
    const bar = document.getElementById('progressFill');
    let start = Date.now();
    if (progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        const elapsed = Date.now() - start;
        const pct = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
        bar.style.width = pct + '%';
    }, 50);
}

// Keyboard controls
document.getElementById('player').onkeydown = (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') goTo((current - 1 + slides.length) % slides.length);
};

render();
resetTimer();
</script>
