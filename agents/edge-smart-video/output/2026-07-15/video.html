<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDGE | LiDAR-assisted landslide detection in road corridors</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #f0f4f0;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

.player {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    box-shadow:
        0 0 0 1px rgba(26, 122, 58, 0.1),
        0 30px 80px rgba(0, 0, 0, 0.6);
    z-index: 1;
}

/* Progress bar */
.progress-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(0,0,0,0.04);
    z-index: 100;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1a7a3a, #145c2d);
    transition: width 0.1s linear;
    width: 0%;
}

/* Slides */
.slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform: scale(0.97);
    padding: 60px 80px;
}
.slide.active {
    opacity: 1;
    transform: scale(1);
}

/* Brand watermark */
.brand-watermark {
    position: absolute;
    top: 24px;
    left: 32px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
}
.brand-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #1a7a3a;
}
.brand-name {
    color: #1a7a3a;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
}

/* Title slide */
.slide-title {
    justify-content: center;
    align-items: center;
    text-align: center;
}
.slide-title .sector-tag {
    color: #1a7a3a;
    font-size: clamp(12px, 1.4vw, 18px);
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
}
.slide-title h1 {
    color: #1e293b;
    font-size: clamp(28px, 4vw, 56px);
    font-weight: 800;
    line-height: 1.15;
    max-width: 800px;
    margin: 0 auto 20px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s forwards;
}
.slide-title .subtitle {
    color: #64748b;
    font-size: clamp(14px, 1.5vw, 22px);
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 0.6s 0.6s forwards;
}
.slide-title .tagline-bar {
    margin-top: 32px;
    width: 60px;
    height: 2px;
    background: #1a7a3a;
    margin-left: auto;
    margin-right: auto;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
}

/* Content slide */
.slide-content {
    justify-content: center;
}
.slide-content .slide-header {
    margin-bottom: 32px;
}
.slide-content .slide-number {
    color: #1a7a3a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 6px;
}
.slide-content h2 {
    color: #1e293b;
    font-size: clamp(22px, 2.8vw, 40px);
    font-weight: 700;
    line-height: 1.2;
    position: relative;
    padding-bottom: 16px;
}
.slide-content h2::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 50px;
    height: 3px;
    background: #1a7a3a;
    border-radius: 2px;
}
.slide-content .bullets {
    margin-top: 28px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.slide-content .bullets li {
    color: #64748b;
    font-size: clamp(13px, 1.3vw, 20px);
    line-height: 1.5;
    padding-left: 28px;
    position: relative;
    opacity: 0;
    animation: fadeUp 0.4s forwards;
}
.slide-content .bullets li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    width: 10px;
    height: 10px;
    border: 2px solid #1a7a3a;
    border-radius: 50%;
    opacity: 0.6;
}
.slide-content .bullets li:nth-child(1) { animation-delay: 0.2s; }
.slide-content .bullets li:nth-child(2) { animation-delay: 0.35s; }
.slide-content .bullets li:nth-child(3) { animation-delay: 0.5s; }
.slide-content .bullets li:nth-child(4) { animation-delay: 0.65s; }

/* Content slide with SVG schematic */
.slide-content.has-svg {
    flex-direction: row;
    align-items: center;
    gap: 40px;
}
.slide-text {
    flex: 1;
    min-width: 0;
}
.slide-svg {
    flex: 0 0 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.6s 0.3s forwards;
}
.slide-svg svg {
    width: 100%;
    height: auto;
    max-height: 340px;
    border-radius: 8px;
}

/* Background SVG for title and CTA slides */
.slide-bg-svg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.06;
    z-index: -1;
    overflow: hidden;
}
.slide-bg-svg svg {
    width: 80%;
    height: 80%;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* CTA slide */
.slide-cta {
    justify-content: center;
    align-items: center;
    text-align: center;
}
.slide-cta h2 {
    color: #1e293b;
    font-size: clamp(24px, 3vw, 44px);
    font-weight: 800;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
}
.slide-cta .cta-url {
    color: #1a7a3a;
    font-size: clamp(18px, 2vw, 32px);
    font-weight: 700;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
}
.slide-cta .cta-sub {
    color: #64748b;
    font-size: clamp(11px, 1vw, 16px);
    margin-top: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
    opacity: 0.4;
}

/* Navigation */
.nav {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    gap: 8px;
    align-items: center;
}
.nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(0,0,0,0.1);
    cursor: pointer;
    transition: all 0.3s;
    border: none;
}
.nav-dot.active {
    background: #1a7a3a;
    box-shadow: 0 0 12px rgba(26, 122, 58, 0.4);
    width: 24px;
    border-radius: 4px;
}

/* Animations */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 640px) {
    .slide { padding: 32px 24px; }
}
</style>
</head>

 360 L 550 345 Z\" fill=\"#d97706\" opacity=\"0.6\" />\n  </g>\n\n</svg>"}, {"slide_index": 1, "slide_type": "content", "headline": "The Challenge", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 340\" width=\"500\" height=\"340\" role=\"img\" aria-labelledby=\"title desc\">\n  <title id=\"title\">LiDAR-assisted landslide detection in road corridors</title>\n  <desc id=\"desc\">An infographic illustrating the challenge of landslide damage in road corridors and the shift from reactive traditional surveys to proactive LiDAR monitoring.</desc>\n\n  <defs>\n    <!-- Gradients -->\n    <linearGradient id=\"bgGrad\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\">\n      <stop offset=\"0%\" stop-color=\"#f8fafc\" />\n      <stop offset=\"100%\" stop-color=\"#e8f4ec\" />\n    </linearGradient>\n\n    <linearGradient id=\"roadSurface\" x1=\"0\" y1=\"0\" x2=\"1\" y2=\"0\">\n      <stop offset=\"0%\" stop-color=\"#f1f5f9\" />\n      <stop offset=\"100%\" stop-color=\"#cbd5e1\" />\n    </linearGradient>\n\n    <!-- Clip Paths for Scanning -->\n    <clipPath id=\"hillClip\">\n      <rect x=\"250\" y=\"90\" width=\"230\" height=\"180\" />\n    </clipPath>\n    <clipPath id=\"gapReveal\">\n      <rect x=\"250\" y=\"90\" width=\"230\" height=\"180\" />\n    </clipPath>\n\n    <!-- Filters -->\n    <filter id=\"dropShadow\" x=\"-20%\" y=\"-20%\" width=\"140%\" height=\"140%\">\n      <feDropShadow dx=\"0\" dy=\"2\" stdDeviation=\"3\" flood-color=\"#000000\" flood-opacity=\"0.1\" />\n    </filter>\n\n    <!-- Arrows and Markers -->\n    <marker id=\"arrow-green\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\">\n      <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#1a7a3a\" />\n    </marker>\n    <marker id=\"arrow-amber\" markerWidth=\"10\" markerHeight=\"10\" refX=\"9\" refY=\"5\" orient=\"auto\">\n      <path d=\"M 0 0 L 10 5 L 0 10 z\" fill=\"#d97706\" />\n    </marker>\n  </defs>\n\n  <!-- Background -->\n  <rect width=\"100%\" height=\"100%\" fill=\"url(#bgGrad)\" />\n\n  <!-- Header & Cost Flag -->\n  <text x=\"250\" y=\"22\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"800\" font-size=\"16\" fill=\"#1e293b\" letter-spacing=\"0.5\">THE CHALLENGE</text>\n  <text x=\"250\" y=\"40\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"10\" fill=\"#64748b\">Geo-engineering \u2014 LiDAR-assisted landslide detection</text>\n\n  <!-- Amber Cost Flag -->\n  <path d=\"M 185 54 L 315 54 L 310 78 L 190 78 Z\" fill=\"#d97706\" />\n  <text x=\"250\" y=\"72\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"700\" font-size=\"14\" fill=\"#ffffff\">\u20ac2.3B ANNUAL LOSS</text>\n\n  <!-- ============================================ -->\n  <!-- LEFT SIDE: FAILING TRADITIONAL METHOD        -->\n  <!-- ============================================ -->\n  <g id=\"panel-left\" transform=\"translate(0, 0)\">\n    \n    <!-- Section Label -->\n    <rect x=\"20\" y=\"94\" width=\"180\" height=\"16\" rx=\"3\" fill=\"#d97706\" />\n    <text x=\"110\" y=\"106\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"700\" font-size=\"9\" fill=\"#ffffff\" letter-spacing=\"0.5\">TRADITIONAL METHOD</text>\n\n    <!-- Terrain & Road -->\n    <path d=\"M 30 200 Q 80 170 110 190 Q 130 200 150 220 L 150 270 Q 100 250 30 260 Z\" fill=\"#e2e8f0\" />\n    \n    <!-- Pavement -->\n    <path d=\"M 30 205 Q 90 175 110 195 L 110 195 Q 130 205 150 225 L 150 245 Q 90 215 30 225 Z\" fill=\"url(#roadSurface)\" />\n    \n    <!-- Road Centerline -->\n    <path d=\"M 35 208 Q 90 178 108 198\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\" />\n    <path d=\"M 118 205 Q 130 212 145 225\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-dasharray=\"3,3\" />\n    \n    <!-- Crack / Gap in Road -->\n    <path d=\"M 110 195 L 115 200 L 113 202 L 108 197 Z\" fill=\"#d97706\" />\n    <path d=\"M 115 200 L 115 220\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1.5\" stroke-dasharray=\"2,2\" />\n\n    <!-- Surveyor -->\n    <g transform=\"translate(68, 185)\">\n      <circle cx=\"0\" cy=\"-4\" r=\"2.5\" fill=\"#1e293b\" />\n      <path d=\"M -1.5 0 L -1.5 7 M 1.5 0 L 1.5 7 M -1.5 2.5 L 1.5 2.5 M -1.5 7 L -3.5 10 M 1.5 7 L 3.5 10\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.5\" stroke-linecap=\"round\" />\n      <!-- Theodolite -->\n      <rect x=\"5\" y=\"2\" width=\"4\" height=\"2\" fill=\"#1e293b\" />\n      <rect x=\"6\" y=\"0\" width=\"2\" height=\"2\" fill=\"#1e293b\" />\n      <line x1=\"7\" y1=\"2\" x2=\"7\" y2=\"7\" stroke=\"#1e293b\" stroke-width=\"1.5\" />\n      <path d=\"M 5 7 L 9 7\" fill=\"none\" stroke=\"#1e293b\" stroke-width=\"1.5\" />\n    </g>\n\n    <!-- Hidden Deformation Blob (Missing signal) -->\n    <path d=\"M 150 270 Q 170 280 190 270 T 230 275 T 250 280\" fill=\"none\" stroke=\"#d1e7d6\" stroke-width=\"8\" stroke-linecap=\"round\" opacity=\"0.4\" />\n    \n    <!-- Static Labels -->\n    <text x=\"90\" y=\"285\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"700\" font-size=\"11\" fill=\"#1e293b\">EARLY SIGNAL MISSED</text>\n    <text x=\"90\" y=\"298\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"9\" fill=\"#64748b\">Ground surveys miss deep</text>\n    <text x=\"90\" y=\"310\" text-anchor=\"middle\" font-family=\"sans-serif\" font-size=\"9\" fill=\"#64748b\">sub-surface deformation.</text>\n\n    <!-- Warning Icons -->\n    <g transform=\"translate(128, 190)\">\n      <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#d97706\" />\n      <text x=\"0\" y=\"2.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"800\" font-size=\"8\" fill=\"#ffffff\">!</text>\n    </g>\n    <g transform=\"translate(160, 260)\">\n      <circle cx=\"0\" cy=\"0\" r=\"6\" fill=\"#d97706\" />\n      <text x=\"0\" y=\"2.5\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"800\" font-size=\"8\" fill=\"#ffffff\">!</text>\n    </g>\n\n  </g>\n\n  <!-- ============================================ -->\n  <!-- CENTER: TRANSITION ARROW                     -->\n  <!-- ============================================ -->\n  <g id=\"center-arrow\" transform=\"translate(235, 180)\">\n    <!-- Dashed Path Background -->\n    <path d=\"M 0 -30 L 0 60\" fill=\"none\" stroke=\"#d1e7d6\" stroke-width=\"4\" stroke-dasharray=\"4,4\" />\n    \n    <!-- Animated Dashed Path Foreground -->\n    <path d=\"M 0 -30 L 0 60\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"4\" stroke-dasharray=\"4,4\">\n      <animate attributeName=\"stroke-dashoffset\" values=\"16;0\" dur=\"1s\" repeatCount=\"indefinite\" />\n    </path>\n    \n    <!-- Downward Arrowhead -->\n    <polygon points=\"0,75 -10,55 10,55\" fill=\"#1a7a3a\">\n      <animateTransform attributeName=\"transform\" type=\"translate\" values=\"0,0; 0,5; 0,0\" dur=\"2s\" repeatCount=\"indefinite\" />\n    </polygon>\n\n    <!-- Text Labels -->\n    <text x=\"0\" y=\"-45\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"700\" font-size=\"10\" fill=\"#1a7a3a\">CRITICAL</text>\n    <text x=\"0\" y=\"-34\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"700\" font-size=\"10\" fill=\"#1a7a3a\">FAILURE</text>\n  </g>\n\n  <!-- ============================================ -->\n  <!-- RIGHT SIDE: PROACTIVE LiDAR SOLUTION         -->\n  <!-- ============================================ -->\n  <g id=\"panel-right\" transform=\"translate(0, 0)\">\n    \n    <!-- Section Label -->\n    <rect x=\"270\" y=\"94\" width=\"210\" height=\"16\" rx=\"3\" fill=\"#1a7a3a\" />\n    <text x=\"375\" y=\"106\" text-anchor=\"middle\" font-family=\"sans-serif\" font-weight=\"700\" font-size=\"9\" fill=\"#ffffff\" letter-spacing=\"0.5\">LiDAR-ASSISTED MONITORING</text>\n\n    <!-- Correct Terrain (Reversed S-Curve) -->\n    <path d=\"M 270 270 Q 320 280 340 250 Q 360 220 400 240 Q 430 260 470 240 L 470 270 L 270 270 Z\" fill=\"#e8f4ec\" stroke=\"#d1e7d6\" stroke-width=\"1.5\" />\n\n    <!-- Healthy Road -->\n    <path d=\"M 270 235 Q 330 245 350 220 Q 370 195 410 210 Q 440 225 470 210 L 470 230 Q 440 245 410 230 Q 370 215 350 240 Q 330 265 270 255 Z\" fill=\"url(#roadSurface)\" />\n    \n    <!-- Road Markings -->\n    <path d=\"M 275 240 Q 335 250 355 225 Q 375 200 415 215\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\" />\n    <path d=\"M 415 225 Q 440 238 470 220\" fill=\"none\" stroke=\"#ffffff\" stroke-width=\"1.5\" stroke-dasharray=\"4,4\" />\n\n    <!-- Detected Hazard Area (Transparent Overlay) -->\n    <path d=\"M 410 260 Q 430 270 450 250 Q 465 235 480 250 Q 490 270 470 280 Q 440 295 410 275 Z\" fill=\"#d1e7d6\" opacity=\"0.6\" />\n    \n    <!-- Hazard Arrows -->\n    <g transform=\"translate(440, 230)\">\n      <polygon points=\"0,0 -3,7 3,7\" fill=\"#1a7a3a\" />\n      <path d=\"M 0 0 L 0 20\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-dasharray=\"2,2\" />\n      <polygon points=\"0,28 -3,21 3,21\" fill=\"#1a7a3a\" />\n    </g>\n\n    <!-- LiDAR Drone / Scanner -->\n    <g id=\"lidar-scanner\" transform=\"translate(370, 70)\">\n      <!-- Drone Body -->\n      <rect x=\"-12\" y=\"-6\" width=\"24\" height=\"12\" rx=\"4\" fill=\"#1a7a3a\" />\n      <!-- Propeller Arms -->\n      <line x1=\"-12\" y1=\"0\" x2=\"-20\" y2=\"-8\" stroke=\"#1a7a3a\" stroke-width=\"2.5\" />\n      <line x1=\"12\" y1=\"0\" x2=\"20\" y2=\"-8\" stroke=\"#1a7a3a\" stroke-width=\"2.5\" />\n      <!-- Animated Propellers -->\n      <ellipse cx=\"-20\" cy=\"-8\" rx=\"6\" ry=\"2\" fill=\"#d97706\" opacity=\"0.8\">\n        <animateTransform attributeName=\"transform\" type=\"rotate\" values=\"0 -20 -8; 360 -20 -8\" dur=\"0.1s\" repeatCount=\"indefinite\" />\n      </ellipse>\n      <ellipse cx=\"20\" cy=\"-8\" rx=\"6\" ry=\"2\" fill=\"#d97706\" opacity=\"0.8\">\n        <animateTransform attributeName=\"transform\" type=\"rotate\" values=\"0 20 -8; 360 20 -8\" dur=\"0.1s\" repeatCount=\"indefinite\" />\n      </ellipse>\n      <!-- Scanner Lens -->\n      <path d=\"M -2 4 L 2 4 L 0 12 Z\" fill=\"#64748b\" />\n    </g>\n\n    <!-- Scanning Beams (animated) -->\n    <g id=\"scan-beams\">\n      <!-- Outer Scan -->\n      <path d=\"M 370 76 L 280 270 Q 375 320 470 270 Z\" fill=\"url(#scanGradOuter)\" opacity=\"0\" style=\"mix-blend-mode: multiply;\">\n        <animate attributeName=\"opacity\" values=\"0;0.3;0\" dur=\"3s\" repeatCount=\"indefinite\" />\n      </path>\n      <!-- Inner Scan -->\n      <path d=\"M 370 76 L 320 210 Q 375 260 430 210 Z\" fill=\"url(#scanGradInner)\" opacity=\"0\" style=\"mix-blend-mode: multiply;\">\n        <animate attributeName=\"opacity\" values=\"0;0.5;0\" dur=\"3s\" begin=\"0.2s\" repeatCount=\"indefinite\" />\n      </path>\n    </g>\n\n    <!-- Data Points Cloud -->\n    <g id=\"data-points\" fill=\"#1a7a3a\" opacity=\"0.8\">\n      <circle cx=\"300\" cy=\"240\" r=\"1.5\" />\n      <circle cx=\"340\" cy=\"210\" r=\"2\" />"}, {"slide_index": 2, "slide_type": "content", "headline": "The EDGE Solution", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 340\" width=\"500\" height=\"340\" fill=\"none\" font-family=\"system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif\">\n  \n  <!-- === Main Inclined LiDAR Data Stream === -->\n  <!-- Base rect -->\n  <rect x=\"87.5\" y=\"117.5\" width=\"25\" height=\"145\" rx=\"2\" fill=\"#e8f4ec\" stroke=\"#d1e7d6\" stroke-width=\"1\"/>\n  <!-- Grid ticks left -->\n  <path d=\"M82.5 122.5H85.5 M82.5 142.5H85.5 M82.5 162.5H85.5 M82.5 182.5H85.5 M82.5 202.5H85.5 M82.5 222.5H85.5 M82.5 242.5H85.5 M82.5 262.5H85.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <!-- Grid ticks right -->\n  <path d=\"M114.5 122.5H117.5 M114.5 142.5H117.5 M114.5 162.5H117.5 M114.5 182.5H117.5 M114.5 202.5H117.5 M114.5 222.5H117.5 M114.5 242.5H117.5 M114.5 262.5H117.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  \n  <!-- LiDAR Signature Waveforms -->\n  <!-- Dense pre-failure -->\n  <path d=\"M97.5 122.5 L105.5 122.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M91.5 132.5 L111.5 132.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M87.5 142.5 L115.5 142.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M91.5 152.5 L111.5 152.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <!-- Sparse/deformed (escarpment) -->\n  <path d=\"M94.5 162.5 L108.5 162.5\" stroke=\"#d97706\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M87.5 172.5 L101.5 172.5\" stroke=\"#d97706\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M107.5 177.5 L115.5 177.5\" stroke=\"#d97706\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M91.5 187.5 L105.5 187.5\" stroke=\"#d97706\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M99.5 192.5 L111.5 192.5\" stroke=\"#d97706\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <!-- Post-failure sparse -->\n  <path d=\"M94.5 202.5 L110.5 202.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M91.5 212.5 L111.5 212.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M87.5 222.5 L115.5 222.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M94.5 232.5 L108.5 232.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M91.5 242.5 L111.5 242.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M97.5 252.5 L105.5 252.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n  <path d=\"M94.5 262.5 L108.5 262.5\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linecap=\"round\"/>\n\n  <!-- === Main Topographic / Road / Landslide Profile === -->\n  <!-- Profile Shape -->\n  <path d=\"M160 245 C 185 238, 200 235, 220 238 C 240 241, 260 255, 290 250 C 310 247, 330 242, 350 245 L 380 255 L 380 270 L 160 270 Z\" fill=\"#e8f4ec\" stroke=\"#1a7a3a\" stroke-width=\"1.5\" stroke-linejoin=\"round\"/>\n  \n  <!-- Road Surface -->\n  <path d=\"M165 248 C 190 240, 205 237, 225 240 C 245 243, 265 258, 295 253 C 315 250, 335 245, 355 248 L 390 258\" fill=\"none\" stroke=\"#145c2d\" stroke-width=\"4\" stroke-linecap=\"round\"/>\n  \n  <!-- Pre-failure surface (now scar and headscarp) -->\n  <path d=\"M220 240 L 235 265 L 290 252\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n  <path d=\"M220 240 L 235 265\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"2\" stroke-dasharray=\"4 3\" opacity=\"0.6\"/>\n  \n  <!-- Landslide crown/escarpment hatched -->\n  <path d=\"M225 240 L 235 265 M230 241 L 240 266 M235 242 L 245 267 M240 243 L 250 268 M245 244 L 255 269 M250 245 L 260 270\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"1\" opacity=\"0.5\" stroke-linecap=\"round\"/>\n\n  <!-- === Millimetre-Scale Measurement Marker === -->\n  <path d=\"M265 210 L 285 210\" stroke=\"#64748b\" stroke-width=\"1\" stroke-linecap=\"round\"/>\n  <path d=\"M265 235 L 285 235\" stroke=\"#64748b\" stroke-width=\"1\" stroke-linecap=\"round\"/>\n  <path d=\"M275 210 L 275 235\" stroke=\"#64748b\" stroke-width=\"1\" stroke-linecap=\"round\"/>\n  <path d=\"M275 228 L 275 235\" stroke=\"#d97706\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n  <text x=\"289\" y=\"235\" font-size=\"8\" fill=\"#64748b\" font-weight=\"600\">0.5 mm</text>\n\n  <!-- Tree 1 (Left) -->\n  <line x1=\"215\" y1=\"233\" x2=\"215\" y2=\"248\" stroke=\"#145c2d\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n  <path d=\"M210 238 L215 233 L220 238 Z M209 241 L215 236 L221 241 Z M208 244 L215 239 L222 244 Z\" fill=\"#1a7a3a\" stroke=\"none\"/>\n  <!-- Tree 2 (Right) -->\n  <line x1=\"335\" y1=\"243\" x2=\"335\" y2=\"258\" stroke=\"#145c2d\" stroke-width=\"2.5\" stroke-linecap=\"round\"/>\n  <path d=\"M330 248 L335 243 L340 248 Z M329 const SLIDE_DURATION = 5000;
let current = 0;
let timer = null;
let progressInterval = null;

function render() {
    const container = document.getElementById('slidesContainer');
    const nav = document.getElementById('nav');
    container.innerHTML = '';
    nav.innerHTML = '';

    slides.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = 'slide' + (i === current ? ' active' : '');

        const svgData = schematics && schematics[i] && schematics[i].svg;

        if (slide.type === 'title') {
            div.className += ' slide-title' + (svgData ? ' has-bg-svg' : '');
            div.innerHTML = `
                ${svgData ? `<div class="slide-bg-svg">${svgData}</div>` : ''}
                <div class="sector-tag">${slide.sector || 'Geo-engineering'}</div>
                <h1>${slide.headline}</h1>
                ${slide.subtitle ? `<div class="subtitle">${slide.subtitle}</div>` : ''}
                <div class="tagline-bar"></div>
            `;
        } else if (slide.type === 'cta') {
            div.className += ' slide-cta' + (svgData ? ' has-bg-svg' : '');
            div.innerHTML = `
                ${svgData ? `<div class="slide-bg-svg">${svgData}</div>` : ''}
                <h2>${slide.headline}</h2>
                <div class="cta-url">${slide.url || 'www.edgeengineers.net'}</div>
                ${slide.subtitle ? `<div class="cta-sub">${slide.subtitle}</div>` : ''}
            `;
        } else {
            div.className += ' slide-content' + (svgData ? ' has-svg' : '');
            const bullets = (slide.bullets || []).map(b => `<li>${b}</li>`).join('');
            div.innerHTML = `
                <div class="slide-text">
                    <div class="slide-header">
                        <div class="slide-number">${slide.number || (i + 1)} / ${slides.length}</div>
                        <h2>${slide.headline}</h2>
                    </div>
                    ${bullets ? `<ul class="bullets">${bullets}</ul>` : ''}
                </div>
                ${svgData ? `<div class="slide-svg">${svgData}</div>` : ''}
            `;
        }

        container.appendChild(div);

        const dot = document.createElement('button');
        dot.className = 'nav-dot' + (i === current ? ' active' : '');
        dot.onclick = () => goTo(i);
        nav.appendChild(dot);
    });
}

function goTo(i) {
    current = i;
    render();
    resetTimer();
}

function next() {
    current = (current + 1) % slides.length;
    render();
    resetTimer();
}

function resetTimer() {
    if (timer) clearInterval(timer);
    if (progressInterval) clearInterval(progressInterval);
    timer = setInterval(next, SLIDE_DURATION);
    updateProgress();
}

function updateProgress() {
    const bar = document.getElementById('progressFill');
    let start = Date.now();
    if (progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        const elapsed = Date.now() - start;
        const pct = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
        bar.style.width = pct + '%';
    }, 50);
}

// Keyboard controls
document.getElementById('player').onkeydown = (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') goTo((current - 1 + slides.length) % slides.length);
};

render();
resetTimer();
</script>
