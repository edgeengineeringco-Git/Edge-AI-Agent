<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDGE | Smart Sensor Networks for Tunnel Deformation Detection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #f0f4f0;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

.player {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    box-shadow:
        0 0 0 1px rgba(26, 122, 58, 0.1),
        0 30px 80px rgba(0, 0, 0, 0.6);
    z-index: 1;
}

/* Progress bar */
.progress-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(0,0,0,0.04);
    z-index: 100;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1a7a3a, #145c2d);
    transition: width 0.1s linear;
    width: 0%;
}

/* Slides */
.slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform: scale(0.97);
    padding: 60px 80px;
}
.slide.active {
    opacity: 1;
    transform: scale(1);
}

/* Brand watermark */
.brand-watermark {
    position: absolute;
    top: 24px;
    left: 32px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
}
.brand-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #1a7a3a;
}
.brand-name {
    color: #1a7a3a;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
}

/* Title slide */
.slide-title {
    justify-content: center;
    align-items: center;
    text-align: center;
}
.slide-title .sector-tag {
    color: #1a7a3a;
    font-size: clamp(12px, 1.4vw, 18px);
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
}
.slide-title h1 {
    color: #1e293b;
    font-size: clamp(28px, 4vw, 56px);
    font-weight: 800;
    line-height: 1.15;
    max-width: 800px;
    margin: 0 auto 20px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s forwards;
}
.slide-title .subtitle {
    color: #64748b;
    font-size: clamp(14px, 1.5vw, 22px);
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 0.6s 0.6s forwards;
}
.slide-title .tagline-bar {
    margin-top: 32px;
    width: 60px;
    height: 2px;
    background: #1a7a3a;
    margin-left: auto;
    margin-right: auto;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
}

/* Content slide */
.slide-content {
    justify-content: center;
}
.slide-content .slide-header {
    margin-bottom: 32px;
}
.slide-content .slide-number {
    color: #1a7a3a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 6px;
}
.slide-content h2 {
    color: #1e293b;
    font-size: clamp(22px, 2.8vw, 40px);
    font-weight: 700;
    line-height: 1.2;
    position: relative;
    padding-bottom: 16px;
}
.slide-content h2::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 50px;
    height: 3px;
    background: #1a7a3a;
    border-radius: 2px;
}
.slide-content .bullets {
    margin-top: 28px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.slide-content .bullets li {
    color: #64748b;
    font-size: clamp(13px, 1.3vw, 20px);
    line-height: 1.5;
    padding-left: 28px;
    position: relative;
    opacity: 0;
    animation: fadeUp 0.4s forwards;
}
.slide-content .bullets li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    width: 10px;
    height: 10px;
    border: 2px solid #1a7a3a;
    border-radius: 50%;
    opacity: 0.6;
}
.slide-content .bullets li:nth-child(1) { animation-delay: 0.2s; }
.slide-content .bullets li:nth-child(2) { animation-delay: 0.35s; }
.slide-content .bullets li:nth-child(3) { animation-delay: 0.5s; }
.slide-content .bullets li:nth-child(4) { animation-delay: 0.65s; }

/* Content slide with SVG schematic */
.slide-content.has-svg {
    flex-direction: row;
    align-items: center;
    gap: 40px;
}
.slide-text {
    flex: 1;
    min-width: 0;
}
.slide-svg {
    flex: 0 0 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.6s 0.3s forwards;
}
.slide-svg svg {
    width: 100%;
    height: auto;
    max-height: 340px;
    border-radius: 8px;
}

/* Background SVG for title and CTA slides */
.slide-bg-svg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.06;
    z-index: -1;
    overflow: hidden;
}
.slide-bg-svg svg {
    width: 80%;
    height: 80%;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* CTA slide */
.slide-cta {
    justify-content: center;
    align-items: center;
    text-align: center;
}
.slide-cta h2 {
    color: #1e293b;
    font-size: clamp(24px, 3vw, 44px);
    font-weight: 800;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
}
.slide-cta .cta-url {
    color: #1a7a3a;
    font-size: clamp(18px, 2vw, 32px);
    font-weight: 700;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
}
.slide-cta .cta-sub {
    color: #64748b;
    font-size: clamp(11px, 1vw, 16px);
    margin-top: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
    opacity: 0.4;
}

/* Navigation */
.nav {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    gap: 8px;
    align-items: center;
}
.nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(0,0,0,0.1);
    cursor: pointer;
    transition: all 0.3s;
    border: none;
}
.nav-dot.active {
    background: #1a7a3a;
    box-shadow: 0 0 12px rgba(26, 122, 58, 0.4);
    width: 24px;
    border-radius: 4px;
}

/* Animations */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 640px) {
    .slide { padding: 32px 24px; }
}
</style>
</head>
<body>
<div class="player" id="player" tabindex="0">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="brand-watermark">
        <div class="brand-dot"></div>
        <div class="brand-name">EDGE Engineers</div>
    </div>
    <div id="slidesContainer"></div>
    <div class="nav" id="nav"></div>
</div>

<script>
const slides = [{"type": "title", "headline": "Smart Sensor Networks for Tunnel Deformation Detection", "subtitle": "Geo-Engineering | EDGE Engineers", "sector": "Geo-Engineering"}, {"type": "content", "headline": "The Blind Spot Beneath Our Cities", "bullets": ["Deformation is continuous \u2014 but inspection is periodic. Cracks open between surveys, undetected.", "Manual total-station rounds are slow, labour-intensive, and leave gaps in coverage.", "A single unplanned tunnel closure can cost six figures per day in lost throughput."]}, {"type": "content", "headline": "The EDGE Sensor Mesh", "bullets": ["Fibre-optic strain sensing + automated robotic total stations + IoT inclinometers.", "Millimetre-level movement streamed continuously to a live operations dashboard.", "Automated threshold alerts fire the moment drift exceeds safe limits \u2014 day or night."]}, {"type": "content", "headline": "Measurable Outcomes", "bullets": ["Early warning weeks ahead of visible distress \u2014 planned intervention, not emergency repair.", "Up to 70% reduction in monitoring labour with higher spatial data density.", "Audit-ready digital records protect life safety and your licence to operate."]}, {"type": "cta", "headline": "Know before it matters.", "url": "www.edgeengineers.net", "subtitle": "ESA Incubatee | MaynoothWorks, Co. Kildare"}];
const schematics = [{"slide_index": 0, "slide_type": "title", "headline": "Smart Sensor Networks for Tunnel Deformation Detection", "svg": "<svg viewBox=\"0 0 600 400\" xmlns=\"http://www.w3.org/2000/svg\">\n  <circle cx=\"300\" cy=\"200\" r=\"150\" fill=\"none\" stroke=\"#145c2d\" stroke-width=\"10\"/>\n  <circle cx=\"300\" cy=\"200\" r=\"110\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"6\"/>\n  <circle cx=\"300\" cy=\"200\" r=\"70\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"3\"/>\n  <g stroke=\"#1a7a3a\" stroke-width=\"3\" opacity=\"0.9\">\n    <line x1=\"300\" y1=\"50\" x2=\"300\" y2=\"350\"/>\n    <line x1=\"150\" y1=\"200\" x2=\"450\" y2=\"200\"/>\n    <line x1=\"194\" y1=\"94\" x2=\"406\" y2=\"306\"/>\n    <line x1=\"406\" y1=\"94\" x2=\"194\" y2=\"306\"/>\n  </g>\n  <g fill=\"#d97706\">\n    <circle cx=\"300\" cy=\"50\" r=\"9\"/><circle cx=\"450\" cy=\"200\" r=\"9\"/>\n    <circle cx=\"300\" cy=\"350\" r=\"9\"/><circle cx=\"150\" cy=\"200\" r=\"9\"/>\n    <circle cx=\"194\" cy=\"94\" r=\"7\"/><circle cx=\"406\" cy=\"306\" r=\"7\"/>\n    <circle cx=\"406\" cy=\"94\" r=\"7\"/><circle cx=\"194\" cy=\"306\" r=\"7\"/>\n  </g>\n  <circle cx=\"300\" cy=\"200\" r=\"14\" fill=\"#1a7a3a\"/>\n</svg>"}, {"slide_index": 1, "slide_type": "content", "headline": "The Blind Spot Beneath Our Cities", "svg": "<svg viewBox=\"0 0 500 340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\">\n  <rect width=\"500\" height=\"340\" fill=\"#e8f4ec\"/>\n  <ellipse cx=\"250\" cy=\"165\" rx=\"135\" ry=\"95\" fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"8\"/>\n  <ellipse cx=\"250\" cy=\"165\" rx=\"100\" ry=\"62\" fill=\"none\" stroke=\"#d1e7d6\" stroke-width=\"4\"/>\n  <text x=\"250\" y=\"40\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"14\" font-weight=\"600\">Periodic survey vs. continuous movement</text>\n  <!-- manual inspection points (green) -->\n  <g fill=\"#1a7a3a\">\n    <circle cx=\"135\" cy=\"165\" r=\"8\"/><circle cx=\"250\" cy=\"70\" r=\"8\"/>\n    <circle cx=\"365\" cy=\"165\" r=\"8\"/><circle cx=\"250\" cy=\"260\" r=\"8\"/>\n  </g>\n  <!-- deformation gap between two survey points (amber) -->\n  <path d=\"M315 120 Q345 175 315 230\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"5\" stroke-dasharray=\"2 6\"/>\n  <circle cx=\"345\" cy=\"175\" r=\"11\" fill=\"#d97706\"/>\n  <text x=\"345\" y=\"205\" text-anchor=\"middle\" fill=\"#d97706\" font-size=\"13\" font-weight=\"700\">crack</text>\n  <text x=\"250\" y=\"312\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"13\">Inspection gap = undetected drift</text>\n</svg>"}, {"slide_index": 2, "slide_type": "content", "headline": "The EDGE Sensor Mesh", "svg": "<svg viewBox=\"0 0 500 340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\">\n  <rect width=\"500\" height=\"340\" fill=\"#e8f4ec\"/>\n  <text x=\"250\" y=\"34\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"15\" font-weight=\"700\">Sensor mesh &#8594; live dashboard</text>\n  <!-- sensor nodes -->\n  <g font-size=\"11\" fill=\"#ffffff\" font-weight=\"700\">\n    <rect x=\"20\" y=\"70\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#1a7a3a\"/><text x=\"80\" y=\"97\" text-anchor=\"middle\">Fibre-Optic</text>\n    <rect x=\"20\" y=\"148\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#1a7a3a\"/><text x=\"80\" y=\"175\" text-anchor=\"middle\">Robotic TS</text>\n    <rect x=\"20\" y=\"226\" width=\"120\" height=\"44\" rx=\"8\" fill=\"#1a7a3a\"/><text x=\"80\" y=\"253\" text-anchor=\"middle\">IoT Inclino.</text>\n  </g>\n  <!-- arrows -->\n  <g stroke=\"#d97706\" stroke-width=\"4\" fill=\"none\" marker-end=\"url(#ar)\">\n    <line x1=\"145\" y1=\"92\" x2=\"205\" y2=\"130\"/><line x1=\"145\" y1=\"170\" x2=\"205\" y2=\"160\"/><line x1=\"145\" y1=\"248\" x2=\"205\" y2=\"190\"/>\n  </g>\n  <defs><marker id=\"ar\" markerWidth=\"10\" markerHeight=\"10\" refX=\"6\" refY=\"3\" orient=\"auto\"><path d=\"M0,0 L6,3 L0,6 Z\" fill=\"#d97706\"/></marker></defs>\n  <!-- edge gateway -->\n  <rect x=\"212\" y=\"128\" width=\"90\" height=\"64\" rx=\"10\" fill=\"#145c2d\"/>\n  <text x=\"257\" y=\"155\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"12\" font-weight=\"700\">Edge</text>\n  <text x=\"257\" y=\"173\" text-anchor=\"middle\" fill=\"#ffffff\" font-size=\"12\" font-weight=\"700\">Gateway</text>\n  <line x1=\"303\" y1=\"160\" x2=\"360\" y2=\"160\" stroke=\"#d97706\" stroke-width=\"4\" marker-end=\"url(#ar)\"/>\n  <!-- dashboard -->\n  <rect x=\"366\" y=\"112\" width=\"118\" height=\"96\" rx=\"10\" fill=\"#ffffff\" stroke=\"#1a7a3a\" stroke-width=\"3\"/>\n  <text x=\"425\" y=\"138\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"12\" font-weight=\"700\">Live Dashboard</text>\n  <rect x=\"380\" y=\"150\" width=\"90\" height=\"10\" rx=\"3\" fill=\"#d1e7d6\"/>\n  <rect x=\"380\" y=\"166\" width=\"64\" height=\"10\" rx=\"3\" fill=\"#d1e7d6\"/>\n  <circle cx=\"468\" cy=\"190\" r=\"9\" fill=\"#d97706\"/>\n  <text x=\"425\" y=\"200\" text-anchor=\"middle\" fill=\"#d97706\" font-size=\"11\" font-weight=\"700\">alert</text>\n  <text x=\"250\" y=\"300\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"12\">Continuous mm-level stream</text>\n</svg>"}, {"slide_index": 3, "slide_type": "content", "headline": "Measurable Outcomes", "svg": "<svg viewBox=\"0 0 500 340\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Inter, Arial, sans-serif\">\n  <rect width=\"500\" height=\"340\" fill=\"#e8f4ec\"/>\n  <text x=\"250\" y=\"36\" text-anchor=\"middle\" fill=\"#1e293b\" font-size=\"15\" font-weight=\"700\">Measurable outcomes</text>\n  <g font-family=\"Inter, Arial, sans-serif\">\n    <rect x=\"28\" y=\"70\" width=\"130\" height=\"190\" rx=\"14\" fill=\"#ffffff\" stroke=\"#d1e7d6\" stroke-width=\"2\"/>\n    <text x=\"93\" y=\"135\" text-anchor=\"middle\" fill=\"#1a7a3a\" font-size=\"34\" font-weight=\"800\">Weeks</text>\n    <text x=\"93\" y=\"168\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"12\">earlier warning</text>\n    <text x=\"93\" y=\"210\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"11\">vs. visible</text>\n    <text x=\"93\" y=\"226\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"11\">distress</text>\n\n    <rect x=\"185\" y=\"70\" width=\"130\" height=\"190\" rx=\"14\" fill=\"#ffffff\" stroke=\"#d1e7d6\" stroke-width=\"2\"/>\n    <text x=\"250\" y=\"135\" text-anchor=\"middle\" fill=\"#d97706\" font-size=\"40\" font-weight=\"800\">70%</text>\n    <text x=\"250\" y=\"168\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"12\">less monitoring</text>\n    <text x=\"250\" y=\"184\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"12\">labour</text>\n\n    <rect x=\"342\" y=\"70\" width=\"130\" height=\"190\" rx=\"14\" fill=\"#ffffff\" stroke=\"#d1e7d6\" stroke-width=\"2\"/>\n    <text x=\"407\" y=\"135\" text-anchor=\"middle\" fill=\"#1a7a3a\" font-size=\"30\" font-weight=\"800\">24/7</text>\n    <text x=\"407\" y=\"168\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"12\">automated</text>\n    <text x=\"407\" y=\"184\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"12\">coverage</text>\n  </g>\n  <text x=\"250\" y=\"300\" text-anchor=\"middle\" fill=\"#64748b\" font-size=\"12\">Audit-ready digital records</text>\n</svg>"}, {"slide_index": 4, "slide_type": "cta", "headline": "Know before it matters.", "svg": "<svg viewBox=\"0 0 600 400\" xmlns=\"http://www.w3.org/2000/svg\">\n  <g fill=\"#1a7a3a\">\n    <rect x=\"120\" y=\"250\" width=\"50\" height=\"80\" rx=\"6\"/>\n    <rect x=\"200\" y=\"210\" width=\"50\" height=\"120\" rx=\"6\"/>\n    <rect x=\"280\" y=\"160\" width=\"50\" height=\"170\" rx=\"6\"/>\n    <rect x=\"360\" y=\"110\" width=\"50\" height=\"220\" rx=\"6\"/>\n    <rect x=\"440\" y=\"70\" width=\"50\" height=\"260\" rx=\"6\"/>\n  </g>\n  <polyline points=\"145,250 225,210 305,160 385,110 465,70\" fill=\"none\" stroke=\"#d97706\" stroke-width=\"6\"/>\n  <polygon points=\"455,60 475,72 455,84\" fill=\"#d97706\"/>\n</svg>"}];
const SLIDE_DURATION = 5000;
let current = 0;
let timer = null;
let progressInterval = null;

function render() {
    const container = document.getElementById('slidesContainer');
    const nav = document.getElementById('nav');
    container.innerHTML = '';
    nav.innerHTML = '';

    slides.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = 'slide' + (i === current ? ' active' : '');

        const svgData = schematics && schematics[i] && schematics[i].svg;

        if (slide.type === 'title') {
            div.className += ' slide-title' + (svgData ? ' has-bg-svg' : '');
            div.innerHTML = `
                ${svgData ? `<div class="slide-bg-svg">${svgData}</div>` : ''}
                <div class="sector-tag">${slide.sector || 'Geo-Engineering'}</div>
                <h1>${slide.headline}</h1>
                ${slide.subtitle ? `<div class="subtitle">${slide.subtitle}</div>` : ''}
                <div class="tagline-bar"></div>
            `;
        } else if (slide.type === 'cta') {
            div.className += ' slide-cta' + (svgData ? ' has-bg-svg' : '');
            div.innerHTML = `
                ${svgData ? `<div class="slide-bg-svg">${svgData}</div>` : ''}
                <h2>${slide.headline}</h2>
                <div class="cta-url">${slide.url || 'www.edgeengineers.net'}</div>
                ${slide.subtitle ? `<div class="cta-sub">${slide.subtitle}</div>` : ''}
            `;
        } else {
            div.className += ' slide-content' + (svgData ? ' has-svg' : '');
            const bullets = (slide.bullets || []).map(b => `<li>${b}</li>`).join('');
            div.innerHTML = `
                <div class="slide-text">
                    <div class="slide-header">
                        <div class="slide-number">${slide.number || (i + 1)} / ${slides.length}</div>
                        <h2>${slide.headline}</h2>
                    </div>
                    ${bullets ? `<ul class="bullets">${bullets}</ul>` : ''}
                </div>
                ${svgData ? `<div class="slide-svg">${svgData}</div>` : ''}
            `;
        }

        container.appendChild(div);

        const dot = document.createElement('button');
        dot.className = 'nav-dot' + (i === current ? ' active' : '');
        dot.onclick = () => goTo(i);
        nav.appendChild(dot);
    });
}

function goTo(i) {
    current = i;
    render();
    resetTimer();
}

function next() {
    current = (current + 1) % slides.length;
    render();
    resetTimer();
}

function resetTimer() {
    if (timer) clearInterval(timer);
    if (progressInterval) clearInterval(progressInterval);
    timer = setInterval(next, SLIDE_DURATION);
    updateProgress();
}

function updateProgress() {
    const bar = document.getElementById('progressFill');
    let start = Date.now();
    if (progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        const elapsed = Date.now() - start;
        const pct = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
        bar.style.width = pct + '%';
    }, 50);
}

// Keyboard controls
document.getElementById('player').onkeydown = (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') goTo((current - 1 + slides.length) % slides.length);
};

render();
resetTimer();
</script>
</body>
</html>
