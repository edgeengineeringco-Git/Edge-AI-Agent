<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDGE | Autonomous Drilling Optimisation Using Real-Time Data</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: #f0f4f0;
    font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    overflow: hidden;
}

.player {
    width: 100%;
    max-width: 960px;
    aspect-ratio: 16/9;
    background: #ffffff;
    position: relative;
    overflow: hidden;
    border-radius: 16px;
    box-shadow:
        0 0 0 1px rgba(26, 122, 58, 0.1),
        0 30px 80px rgba(0, 0, 0, 0.6);
    z-index: 1;
}

/* Progress bar */
.progress-bar {
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: rgba(0,0,0,0.04);
    z-index: 100;
}
.progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #1a7a3a, #145c2d);
    transition: width 0.1s linear;
    width: 0%;
}

/* Slides */
.slide {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    opacity: 0;
    transition: opacity 0.6s ease, transform 0.6s ease;
    transform: scale(0.97);
    padding: 60px 80px;
}
.slide.active {
    opacity: 1;
    transform: scale(1);
}

/* Brand watermark */
.brand-watermark {
    position: absolute;
    top: 24px;
    left: 32px;
    z-index: 50;
    display: flex;
    align-items: center;
    gap: 10px;
}
.brand-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #1a7a3a;
}
.brand-name {
    color: #1a7a3a;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0.6;
}

/* Title slide */
.slide-title {
    justify-content: center;
    align-items: center;
    text-align: center;
}
.slide-title .sector-tag {
    color: #1a7a3a;
    font-size: clamp(12px, 1.4vw, 18px);
    font-weight: 600;
    letter-spacing: 6px;
    text-transform: uppercase;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
}
.slide-title h1 {
    color: #1e293b;
    font-size: clamp(28px, 4vw, 56px);
    font-weight: 800;
    line-height: 1.15;
    max-width: 800px;
    margin: 0 auto 20px;
    opacity: 0;
    animation: fadeUp 0.6s 0.4s forwards;
}
.slide-title .subtitle {
    color: #64748b;
    font-size: clamp(14px, 1.5vw, 22px);
    font-weight: 300;
    opacity: 0;
    animation: fadeUp 0.6s 0.6s forwards;
}
.slide-title .tagline-bar {
    margin-top: 32px;
    width: 60px;
    height: 2px;
    background: #1a7a3a;
    margin-left: auto;
    margin-right: auto;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
}

/* Content slide */
.slide-content {
    justify-content: center;
}
.slide-content .slide-header {
    margin-bottom: 32px;
}
.slide-content .slide-number {
    color: #1a7a3a;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 4px;
    text-transform: uppercase;
    opacity: 0.5;
    margin-bottom: 6px;
}
.slide-content h2 {
    color: #1e293b;
    font-size: clamp(22px, 2.8vw, 40px);
    font-weight: 700;
    line-height: 1.2;
    position: relative;
    padding-bottom: 16px;
}
.slide-content h2::after {
    content: '';
    position: absolute;
    bottom: 0; left: 0;
    width: 50px;
    height: 3px;
    background: #1a7a3a;
    border-radius: 2px;
}
.slide-content .bullets {
    margin-top: 28px;
    list-style: none;
    display: flex;
    flex-direction: column;
    gap: 14px;
}
.slide-content .bullets li {
    color: #64748b;
    font-size: clamp(13px, 1.3vw, 20px);
    line-height: 1.5;
    padding-left: 28px;
    position: relative;
    opacity: 0;
    animation: fadeUp 0.4s forwards;
}
.slide-content .bullets li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 10px;
    width: 10px;
    height: 10px;
    border: 2px solid #1a7a3a;
    border-radius: 50%;
    opacity: 0.6;
}
.slide-content .bullets li:nth-child(1) { animation-delay: 0.2s; }
.slide-content .bullets li:nth-child(2) { animation-delay: 0.35s; }
.slide-content .bullets li:nth-child(3) { animation-delay: 0.5s; }
.slide-content .bullets li:nth-child(4) { animation-delay: 0.65s; }

/* Content slide with SVG schematic */
.slide-content.has-svg {
    flex-direction: row;
    align-items: center;
    gap: 40px;
}
.slide-text {
    flex: 1;
    min-width: 0;
}
.slide-svg {
    flex: 0 0 380px;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    animation: fadeIn 0.6s 0.3s forwards;
}
.slide-svg svg {
    width: 100%;
    height: auto;
    max-height: 340px;
    border-radius: 8px;
}

/* Background SVG for title and CTA slides */
.slide-bg-svg {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0.06;
    z-index: -1;
    overflow: hidden;
}
.slide-bg-svg svg {
    width: 80%;
    height: 80%;
}

@keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
}

/* CTA slide */
.slide-cta {
    justify-content: center;
    align-items: center;
    text-align: center;
}
.slide-cta h2 {
    color: #1e293b;
    font-size: clamp(24px, 3vw, 44px);
    font-weight: 800;
    margin-bottom: 16px;
    opacity: 0;
    animation: fadeUp 0.6s 0.2s forwards;
}
.slide-cta .cta-url {
    color: #1a7a3a;
    font-size: clamp(18px, 2vw, 32px);
    font-weight: 700;
    letter-spacing: 2px;
    opacity: 0;
    animation: fadeUp 0.6s 0.5s forwards;
}
.slide-cta .cta-sub {
    color: #64748b;
    font-size: clamp(11px, 1vw, 16px);
    margin-top: 20px;
    letter-spacing: 3px;
    text-transform: uppercase;
    opacity: 0;
    animation: fadeUp 0.6s 0.8s forwards;
    opacity: 0.4;
}

/* Navigation */
.nav {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 50;
    display: flex;
    gap: 8px;
    align-items: center;
}
.nav-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: rgba(0,0,0,0.1);
    cursor: pointer;
    transition: all 0.3s;
    border: none;
}
.nav-dot.active {
    background: #1a7a3a;
    box-shadow: 0 0 12px rgba(26, 122, 58, 0.4);
    width: 24px;
    border-radius: 4px;
}

/* Animations */
@keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

/* Responsive */
@media (max-width: 640px) {
    .slide { padding: 32px 24px; }
}
</style>
</head>
<body>
<div class="player" id="player" tabindex="0">
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
    <div class="brand-watermark">
        <div class="brand-dot"></div>
        <div class="brand-name">EDGE Engineers</div>
    </div>
    <div id="slidesContainer"></div>
    <div class="nav" id="nav"></div>
</div>

<script>
const slides = [{"type": "title", "headline": "Autonomous Drilling, Optimised in Real Time", "subtitle": "Civil Automation | EDGE Engineers", "sector": "Civil Automation"}, {"type": "content", "headline": "Drilling Blind", "bullets": ["Fixed rig parameters set before the borehole even begins", "Refusal, voids and changing ground spotted days too late", "Non-productive time and over-drilling silently burn budget"]}, {"type": "content", "headline": "The Rig That Thinks", "bullets": ["Live torque, ROP, vibration & gamma stream into adaptive control", "Rig self-tunes drilling parameters to the ground as it advances", "Ground classified in real time \u2014 no waiting on the lab"]}, {"type": "content", "headline": "What It Means for Your Project", "bullets": ["Up to 30% faster boreholes via live parameter tuning", "Early anomaly detection before it becomes a change-order", "Clean digital record feeding straight into your model"]}, {"type": "cta", "headline": "Stop drilling on yesterday's data.", "url": "www.edgeengineers.net", "subtitle": "ESA Incubatee | MaynoothWorks, Co. Kildare"}];

=\"16\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">!</text>\n  <text x=\"250\" y=\"120\" font-family=\"Inter,Arial,sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#1e293b\" text-anchor=\"middle\">Fixed Plan</text>\n  <text x=\"335\" y=\"332\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#64748b\" text-anchor=\"middle\">Hidden Void / Refusal</text>\n  <text x=\"95\" y=\"292\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"600\" fill=\"#64748b\" text-anchor=\"middle\">Unknown Ground</text>\n</svg>"}, {"slide_index": 2, "slide_type": "content", "headline": "The Rig That Thinks", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 340\">\n  <rect x=\"180\" y=\"138\" width=\"140\" height=\"64\" rx=\"10\" fill=\"#1a7a3a\"/>\n  <text x=\"250\" y=\"170\" font-family=\"Inter,Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">Adaptive</text>\n  <text x=\"250\" y=\"189\" font-family=\"Inter,Arial,sans-serif\" font-size=\"14\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">Control</text>\n  <rect x=\"28\" y=\"138\" width=\"132\" height=\"64\" rx=\"10\" fill=\"#e8f4ec\" stroke=\"#1a7a3a\" stroke-width=\"2\"/>\n  <text x=\"94\" y=\"162\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#145c2d\" text-anchor=\"middle\">Live Sensors</text>\n  <text x=\"94\" y=\"180\" font-family=\"Inter,Arial,sans-serif\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">Torque \u00b7 ROP \u00b7 gamma</text>\n  <rect x=\"340\" y=\"138\" width=\"132\" height=\"64\" rx=\"10\" fill=\"#e8f4ec\" stroke=\"#1a7a3a\" stroke-width=\"2\"/>\n  <text x=\"406\" y=\"162\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#145c2d\" text-anchor=\"middle\">Self-Tuning</text>\n  <text x=\"406\" y=\"180\" font-family=\"Inter,Arial,sans-serif\" font-size=\"10\" fill=\"#64748b\" text-anchor=\"middle\">Rig Parameters</text>\n  <g stroke=\"#d97706\" stroke-width=\"3\" fill=\"none\">\n    <line x1=\"160\" y1=\"170\" x2=\"176\" y2=\"170\"/>\n    <polygon points=\"178,170 168,164 168,176\" fill=\"#d97706\" stroke=\"none\"/>\n    <line x1=\"320\" y1=\"170\" x2=\"338\" y2=\"170\"/>\n    <polygon points=\"340,170 330,164 330,176\" fill=\"#d97706\" stroke=\"none\"/>\n    <path d=\"M406,206 C406,300 94,300 94,206\"/>\n    <polygon points=\"94,206 100,193 88,193\" fill=\"#d97706\" stroke=\"none\"/>\n  </g>\n</svg>"}, {"slide_index": 3, "slide_type": "content", "headline": "What It Means for Your Project", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 500 340\">\n  <text x=\"30\" y=\"38\" font-family=\"Inter,Arial,sans-serif\" font-size=\"16\" font-weight=\"700\" fill=\"#1e293b\">Project Impact</text>\n  <text x=\"30\" y=\"88\" font-family=\"Inter,Arial,sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#64748b\">Borehole Speed</text>\n  <rect x=\"30\" y=\"96\" width=\"380\" height=\"22\" rx=\"4\" fill=\"#e8f4ec\"/>\n  <rect x=\"30\" y=\"96\" width=\"300\" height=\"22\" rx=\"4\" fill=\"#1a7a3a\"/>\n  <text x=\"340\" y=\"113\" font-family=\"Inter,Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#d97706\">+30%</text>\n  <text x=\"30\" y=\"148\" font-family=\"Inter,Arial,sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#64748b\">Ground Classification</text>\n  <rect x=\"30\" y=\"156\" width=\"380\" height=\"22\" rx=\"4\" fill=\"#e8f4ec\"/>\n  <rect x=\"30\" y=\"156\" width=\"380\" height=\"22\" rx=\"4\" fill=\"#145c2d\"/>\n  <text x=\"250\" y=\"172\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#ffffff\" text-anchor=\"middle\">Real-time, not days</text>\n  <text x=\"30\" y=\"208\" font-family=\"Inter,Arial,sans-serif\" font-size=\"13\" font-weight=\"600\" fill=\"#64748b\">Anomaly Detection</text>\n  <rect x=\"30\" y=\"216\" width=\"380\" height=\"22\" rx=\"4\" fill=\"#e8f4ec\"/>\n  <rect x=\"30\" y=\"216\" width=\"250\" height=\"22\" rx=\"4\" fill=\"#1a7a3a\"/>\n  <text x=\"290\" y=\"233\" font-family=\"Inter,Arial,sans-serif\" font-size=\"12\" font-weight=\"700\" fill=\"#64748b\">Pre change-order</text>\n  <rect x=\"30\" y=\"268\" width=\"440\" height=\"42\" rx=\"8\" fill=\"#d1e7d6\"/>\n  <text x=\"250\" y=\"294\" font-family=\"Inter,Arial,sans-serif\" font-size=\"13\" font-weight=\"700\" fill=\"#145c2d\" text-anchor=\"middle\">Clean digital record to your model</text>\n</svg>"}, {"slide_index": 4, "slide_type": "cta", "headline": "Stop drilling on yesterday's data.", "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 600 400\">\n  <g fill=\"none\" stroke=\"#1a7a3a\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n    <polyline points=\"80,320 200,262 320,200 440,140 540,90\"/>\n    <polyline points=\"440,140 540,90 540,162\"/>\n    <polyline points=\"440,140 512,140\"/>\n  </g>\n  <g stroke=\"#d97706\" stroke-width=\"4\" opacity=\"0.85\" stroke-linecap=\"round\">\n    <line x1=\"70\" y1=\"358\" x2=\"540\" y2=\"358\"/>\n  </g>\n  <g fill=\"#1a7a3a\" opacity=\"0.55\">\n    <circle cx=\"80\" cy=\"320\" r=\"6\"/>\n    <circle cx=\"200\" cy=\"262\" r=\"6\"/>\n    <circle cx=\"320\" cy=\"200\" r=\"6\"/>\n    <circle cx=\"440\" cy=\"140\" r=\"6\"/>\n  </g>\n</svg>"}];
const SLIDE_DURATION = 5000;
let current = 0;
let timer = null;
let progressInterval = null;

function render() {
    const container = document.getElementById('slidesContainer');
    const nav = document.getElementById('nav');
    container.innerHTML = '';
    nav.innerHTML = '';

    slides.forEach((slide, i) => {
        const div = document.createElement('div');
        div.className = 'slide' + (i === current ? ' active' : '');

        const svgData = schematics && schematics[i] && schematics[i].svg;

        if (slide.type === 'title') {
            div.className += ' slide-title' + (svgData ? ' has-bg-svg' : '');
            div.innerHTML = `
                ${svgData ? `<div class="slide-bg-svg">${svgData}</div>` : ''}
                <div class="sector-tag">${slide.sector || 'Civil Automation'}</div>
                <h1>${slide.headline}</h1>
                ${slide.subtitle ? `<div class="subtitle">${slide.subtitle}</div>` : ''}
                <div class="tagline-bar"></div>
            `;
        } else if (slide.type === 'cta') {
            div.className += ' slide-cta' + (svgData ? ' has-bg-svg' : '');
            div.innerHTML = `
                ${svgData ? `<div class="slide-bg-svg">${svgData}</div>` : ''}
                <h2>${slide.headline}</h2>
                <div class="cta-url">${slide.url || 'www.edgeengineers.net'}</div>
                ${slide.subtitle ? `<div class="cta-sub">${slide.subtitle}</div>` : ''}
            `;
        } else {
            div.className += ' slide-content' + (svgData ? ' has-svg' : '');
            const bullets = (slide.bullets || []).map(b => `<li>${b}</li>`).join('');
            div.innerHTML = `
                <div class="slide-text">
                    <div class="slide-header">
                        <div class="slide-number">${slide.number || (i + 1)} / ${slides.length}</div>
                        <h2>${slide.headline}</h2>
                    </div>
                    ${bullets ? `<ul class="bullets">${bullets}</ul>` : ''}
                </div>
                ${svgData ? `<div class="slide-svg">${svgData}</div>` : ''}
            `;
        }

        container.appendChild(div);

        const dot = document.createElement('button');
        dot.className = 'nav-dot' + (i === current ? ' active' : '');
        dot.onclick = () => goTo(i);
        nav.appendChild(dot);
    });
}

function goTo(i) {
    current = i;
    render();
    resetTimer();
}

function next() {
    current = (current + 1) % slides.length;
    render();
    resetTimer();
}

function resetTimer() {
    if (timer) clearInterval(timer);
    if (progressInterval) clearInterval(progressInterval);
    timer = setInterval(next, SLIDE_DURATION);
    updateProgress();
}

function updateProgress() {
    const bar = document.getElementById('progressFill');
    let start = Date.now();
    if (progressInterval) clearInterval(progressInterval);
    progressInterval = setInterval(() => {
        const elapsed = Date.now() - start;
        const pct = Math.min((elapsed / SLIDE_DURATION) * 100, 100);
        bar.style.width = pct + '%';
    }, 50);
}

// Keyboard controls
document.getElementById('player').onkeydown = (e) => {
    if (e.key === 'ArrowRight') next();
    if (e.key === 'ArrowLeft') goTo((current - 1 + slides.length) % slides.length);
};

render();
resetTimer();
</script>
</body>
</html>
